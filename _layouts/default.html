<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | default: site.title }}</title>
<style>
  body{max-width:52rem;margin:0 auto;padding:2rem 1.25rem 6rem;
       font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;color:#14181d}
  a{color:#0b5cad} h1,h2,h3{line-height:1.2;margin-top:2rem}
  code{background:#f2f4f6;padding:.15em .35em;border-radius:3px;font-size:.9em}
  pre{background:#f7f9fa;border:1px solid #e2e8ed;padding:1rem;overflow-x:auto;border-radius:4px}
  pre code{background:none;padding:0}
  table{border-collapse:collapse;width:100%;margin:1.25rem 0;font-size:.94em}
  th,td{border:1px solid #dde3e8;padding:.5rem .7rem;text-align:left;vertical-align:top}
  th{background:#f2f4f6} blockquote{border-left:3px solid #c9d2d8;margin:1.25rem 0;padding:.25rem 1rem;color:#4a545e}
  .mermaid{margin:1.5rem 0;text-align:center}
  nav.top{border-bottom:1px solid #e2e8ed;padding-bottom:.75rem;margin-bottom:1.5rem;font-size:.9em}
</style>
</head>
<body>
<nav class="top">
  <a href="{{ '/course/' | relative_url }}">Course materials</a> ·
  <a href="{{ '/course/labs/' | relative_url }}">Labs</a> ·
  <a href="{{ site.github.repository_url }}">Repository</a>
</nav>

{{ content }}

<!--
  Jekyll does NOT render Mermaid. It emits the block as <pre><code class="language-mermaid">,
  which the Mermaid script does not look for by default. This rewrites those blocks into
  <pre class="mermaid"> before initialising, which is the whole fix.
-->
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
  document.querySelectorAll('pre > code.language-mermaid').forEach((code) => {
    const pre = document.createElement('pre');
    pre.className = 'mermaid';
    pre.textContent = code.textContent;
    code.parentElement.replaceWith(pre);
  });
  mermaid.initialize({ startOnLoad: true, theme: 'neutral' });
</script>
</body>
</html>
